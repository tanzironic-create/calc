<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>뉴퍼트 대시보드</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262a33; --ink:#e9ebf0; --muted:#8b91a0; --acc:#3ddc97; --warn:#ffb020; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 "Pretendard","Malgun Gothic",system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  a.card { display:flex; gap:14px; align-items:center; text-decoration:none; color:inherit; background:var(--card);
           border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  a.card:active { transform:scale(.99); }
  .ic { flex:0 0 46px; height:46px; border-radius:12px; display:grid; place-items:center; font-size:24px; background:#20242d; }
  .t b { display:block; font-size:16px; }
  .t span { color:var(--muted); font-size:13px; }
  .go { margin-left:auto; color:var(--muted); font-size:20px; }
  .off { opacity:.45; pointer-events:none; }
  .key { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-top:20px; font-size:13px; color:var(--muted); }
  .key input { font:inherit; width:100%; margin-top:8px; padding:10px; border-radius:10px; border:1px solid var(--line); background:#0f1115; color:var(--ink); }
  .key button { font:inherit; margin-top:8px; padding:9px 14px; border-radius:10px; border:0; background:var(--acc); color:#06140d; font-weight:700; }
  .warn { color:var(--warn); }
</style>
</head>
<body>
<main>
  <h1>뉴퍼트 대시보드</h1>
  <p class="sub" id="upd">주소 확인 중…</p>

  <a class="card" id="agent" target="_blank" rel="noopener">
    <div class="ic">📊</div><div class="t"><b>에이전트 팀 대시보드</b><span>영상 제작 진행 상황</span></div><div class="go">›</div></a>
  <a class="card" id="upload" target="_blank" rel="noopener">
    <div class="ic">🚀</div><div class="t"><b>업로드 대시보드</b><span>유튜브 · 인스타 · 페이스북 · 자동 DM</span></div><div class="go">›</div></a>

  <div class="key">
    업로드 대시보드 접속 키 — 이 기기에서 한 번만 넣으면 기억합니다.
    <input id="k" placeholder="접속 키" autocomplete="off">
    <button onclick="saveKey()">저장</button> <span id="ks"></span>
  </div>
  <p class="sub" style="margin-top:16px">집 PC가 켜져 있을 때만 대시보드가 열립니다. PC를 다시 켜면 1~2분 뒤 이 페이지의 주소가 자동으로 바뀝니다.</p>
</main>
<script>
function getKey(){ try { return localStorage.getItem("nfkey") || ""; } catch(e){ return ""; } }
function saveKey(){
  const v = document.getElementById("k").value.trim();
  try { localStorage.setItem("nfkey", v); } catch(e) {}
  document.getElementById("ks").textContent = v ? "저장됨" : "지움";
  load();
}
async function load(){
  try {
    const r = await fetch("links.json?t=" + Date.now(), {cache:"no-store"});
    const d = await r.json();
    document.getElementById("upd").textContent = "주소 갱신: " + d.updated;
    const a = document.getElementById("agent"), u = document.getElementById("upload");
    if (d.agent) { a.href = d.agent; a.classList.remove("off"); } else a.classList.add("off");
    const k = getKey();
    if (d.upload) { u.href = d.upload + (k ? "/#key=" + encodeURIComponent(k) : ""); u.classList.remove("off"); } else u.classList.add("off");
  } catch(e) {
    document.getElementById("upd").innerHTML = "<span class='warn'>주소를 불러오지 못했습니다. 잠시 뒤 새로고침하세요.</span>";
  }
}
document.getElementById("k").value = getKey();
load();
</script>
</body>
</html>
